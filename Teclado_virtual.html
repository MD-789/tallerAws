	function escribe() {
		
		switch(sw){
		case 0:
		document.getElementById("pantalla").value += this.value;
		break;
		case 1:
		document.getElementById("pantalla").value += (this.value).toUpperCase();
		sw = 0;
		break;
		case 2:
		document.getElementById("pantalla").value += (this.value).toUpperCase();
		break;
		default:
		alert("Error");
		break;
		}
    }
	function borrar() {
		
        document.getElementById("pantalla").value = "";
    }
	function retro() {
		
		document.getElementById("pantalla").value = document.getElementById("pantalla").value.substring(0, document.getElementById("pantalla").value.length-1);
    }
	function shiftu(){
		sw = 1;
	}
	function mayking(){
		if(pulsado == 0){
		pulsado = 1;
		sw = 2;
		}else if (pulsado == 1){
		pulsado = 0;
		sw = 0;
		}
	}
	function guardamos(){
		misPals.push(document.getElementById("pantalla").value);
		document.getElementById("pantalla").value = "";
	}
	
	function mostramos(){
	document.getElementById("pantalla").value = "";
	var teclas = document.getElementsByName("tecla");
		for (var i = 0; i < teclas.length; i++){
			teclas[i].disabled = true;
		}
	document.getElementById("mostrar").disabled = true;	
	document.getElementById("teclea").disabled = false;

	primero.disabled = false;
	var retroceder = document.getElementById("retroceder");

	}
	function tecleamos(){
	document.getElementById("pantalla").value = "";
	var teclas = document.getElementsByName("tecla");
		for (var i = 0; i < teclas.length; i++){
			teclas[i].disabled = false;
		}
	document.getElementById("teclea").disabled = true;
	document.getElementById("mostrar").disabled = false;	
	var primero = document.getElementById("primero");
	primero.disabled = true;
	var retroceder = document.getElementById("retroceder");
	retroceder.disabled = true;
	var avanzar = document.getElementById("avanzar");
	avanzar.disabled = true;
	var ultimo = document.getElementById("ultimo");
	ultimo.disabled = true;
	var limpiar = document.getElementById("limpiar");
	limpiar.disabled = false;
	var retroceso = document.getElementById("retro");
	retroceso.disabled = false;
	var shifu = document.getElementById("shift");
	shifu.disabled = false;
	var mayus = document.getElementById("mayus");
	mayus.disabled = false;
	var guardar = document.getElementById("guardar");
	guardar.disabled = false;
	}
	function mprimero(){
	index = 0;
	document.getElementById("pantalla").value = misPals[index];
	}
	function manterior(){
	index -= 1;
	if(index < 0){
	index = misPals.length-1;
	}
	document.getElementById("pantalla").value = misPals[index];
	}
	function msiguiente(){
	index += 1;
	if(index > misPals.length-1){
	index = 0;
	}
	document.getElementById("pantalla").value = misPals[index];
	}
	function multimo(){
	index = misPals.length-1;
	document.getElementById("pantalla").value = misPals[index];
	}
